<script>
(function () {
  var blob = location.hash ? location.hash.substring(1) : location.search.substring(1);
  var state = new URLSearchParams(blob).get("state") || "";
  var port = parseInt(state.split("-")[0], 10);
  if (blob && port >= 49215 && port <= 49314) {
    location.replace("http://localhost:" + port + "/callback?" + blob);
    return;
  }
  location.replace("ok.html?fail=1");
})();
</script>
